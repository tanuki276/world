<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nucleus End (Web) - Stage 1 試作</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0c1118; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  #app canvas { display: block; }
  .panel { position: fixed; z-index: 10; color: #e8eef5; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  #title { top: 14px; left: 16px; pointer-events: none; }
  #title .name { font-size: 21px; letter-spacing: .28em; font-weight: 700; }
  #title .sub { font-size: 11px; letter-spacing: .14em; color: #a9bfd4; margin-top: 2px; }
  #objective { top: 74px; left: 16px; font-size: 13px; color: #ffd98a; pointer-events: none; }
  #zone { top: 12vh; left: 0; right: 0; text-align: center; font-size: 30px; letter-spacing: .35em; font-weight: 700; opacity: 0; transition: opacity 1.1s; pointer-events: none; }
  #toast { bottom: 128px; left: 0; right: 0; text-align: center; font-size: 14px; color: #ffe9b0; opacity: 0; transition: opacity .5s; pointer-events: none; }
  #prompt { bottom: 96px; left: 0; right: 0; text-align: center; font-size: 13px; color: #cfe3f5; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #dialogue { display: none; bottom: 22px; left: 50%; transform: translateX(-50%); width: min(680px, 92vw); background: rgba(8, 13, 20, .82); border: 1px solid #47617e; border-radius: 8px; padding: 12px 16px; box-sizing: border-box; }
  #dlg-name { font-size: 12px; color: #8fd6a4; letter-spacing: .12em; margin-bottom: 5px; }
  #dlg-text { font-size: 15px; line-height: 1.75; }
  #dlg-hint { font-size: 11px; color: #7e93a8; text-align: right; margin-top: 6px; }
  #help { bottom: 12px; left: 14px; font-size: 11px; color: #8ea6bb; line-height: 1.7; pointer-events: none; }
  #flash { position: fixed; inset: 0; background: #dfe9ff; opacity: 0; pointer-events: none; z-index: 20; }
  #loading { bottom: 52px; left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .2em; color: #a9c6e2; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #start { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(5, 9, 14, .45); color: #e8eef5; font-size: 15px; letter-spacing: .12em; cursor: pointer; }
  /* Touch controls (iPad): shown only when a coarse pointer is detected */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }
  #stick { position: fixed; left: 22px; bottom: 26px; width: 128px; height: 128px; z-index: 15; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.28); touch-action: none; }
  #stick-nub { position: absolute; left: 38px; top: 38px; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.32); border: 1px solid rgba(255,255,255,.5); }
  .tbtn { position: fixed; z-index: 15; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #e8eef5; background: rgba(8, 13, 20, .55); border: 1px solid rgba(255,255,255,.35); touch-action: none; user-select: none; -webkit-user-select: none; }
  #btn-talk { right: 22px; bottom: 30px; width: 72px; height: 72px; font-size: 14px; }
  #btn-storm { right: 108px; bottom: 116px; width: 56px; height: 56px; font-size: 12px; }
  #app canvas { touch-action: none; }
  body.touch #dialogue { cursor: pointer; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }</script>
</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<div class="panel" id="title"><div class="name">NUCLEUS END</div><div class="sub">Web版 ― Stage 1 試作 / シェネタプラ島</div></div>
<div class="panel" id="objective"></div>
<div class="panel" id="zone"></div>
<div class="panel" id="toast"></div>
<div class="panel" id="loading">地域を読み込み中…</div>
<div class="panel" id="prompt">[E] 話す</div>
<div class="panel" id="dialogue"><div id="dlg-name"></div><div id="dlg-text"></div><div id="dlg-hint">E： 次へ</div></div>
<div class="panel" id="help">WASD 移動 / Shift 疾走 / マウス 視点（画面クリックで固定）<br>E 話す / T アスラティ雷雨を呼ぶ</div>
<div id="touch-ui">
  <div id="stick"><div id="stick-nub"></div></div>
  <div class="tbtn" id="btn-talk">話す</div>
  <div class="tbtn" id="btn-storm">雷雨</div>
</div>
<div id="start">クリックして探索開始</div>
<script>
  if (new URLSearchParams(location.search).has('cam')) document.getElementById('start').style.display = 'none';
  document.getElementById('start').addEventListener('click', function () { this.style.display = 'none'; });
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
